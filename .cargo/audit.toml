# cargo-audit configuration (read by rustsec/audit-check in CI).
# Keep this list in sync with [advisories].ignore in .github/deny.toml.
# Every entry is transitive with no compatible fix; revisit on each
# loco-rs / activitypub_federation upgrade.

[advisories]
ignore = [
    # unsafe-libyaml unmaintained, via serde_yaml -> loco-rs. No known CVE.
    "RUSTSEC-2024-0449",
    # rsa Marvin timing side channel. No fixed release exists; pulled in by
    # activitypub_federation for HTTP signatures. We only sign (private key
    # never used for decryption), which limits exposure.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 timing variability, via p256/p384 -> jsonwebtoken's
    # rust_crypto backend (loco-rs 1.2 enables it). Taverna only signs and
    # verifies HS256 session tokens, so the elliptic-curve code never runs.
    "RUSTSEC-2026-0387",
]
