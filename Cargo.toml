[workspace]

[package]
name = "taverna"
version = "0.0.8"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["yezanek"]
publish = false
default-run = "taverna-cli"

[workspace.dependencies]
loco-rs = { version = "1.2" }

[dependencies]
loco-rs = { workspace = true, features = ["with-db"] }
axum = { version = "0.8" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
activitypub_federation = { version = "0.7.0-beta.14", features = ["axum"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
tera = "2"
pulldown-cmark = "0.13"
ammonia = "4"
url = "2"
argon2 = "0.6"
tower = "0.5"
tower_governor = { version = "0.8", features = ["axum"] }
governor = "0.10"
tracing = "0.1"
anyhow = "1"
time = "0.3"
thiserror = "2"
validator = { version = "0.20", features = ["derive"] }
include_dir = "0.7"
axum-extra = { version = "0.12", features = ["cookie", "form"] }
regex = "1.11"
dotenvy = "0.15"
migration = { path = "migration" }

[[bin]]
name = "taverna-cli"
path = "src/bin/main.rs"

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = "4"
axum-test = "17.3"

# Password hashing (argon2) and RSA key generation are extremely slow without
# optimisation. Compile the crypto crates optimised even in dev/test builds so
# the test suite isn't dominated by hashing and keypair generation.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[lints.clippy]
# loco_rs::Error is a large framework enum that every handler, model and
# worker returns; it cannot be boxed from our side.
result_large_err = "allow"
