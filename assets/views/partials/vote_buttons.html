<div class="vote-buttons" id="vote-{{ target_id }}">
  <button class="vote-btn upvote {% if user_vote == 1 %}active{% endif %}"
    hx-post="{{ vote_url }}"
    hx-vals='{"vote":"1","csrf_token":"{{ csrf_token }}"}'
    hx-target="#vote-{{ target_id }}"
    hx-swap="outerHTML"
    aria-label="Upvote"
    title="Upvote"
    aria-pressed="{% if user_vote == 1 %}true{% else %}false{% endif %}">{% include "icons/arrow-up.html" %}</button>
  <span class="score{% if score_class %} {{ score_class }}{% endif %}">{{ score }}</span>
  <button class="vote-btn downvote {% if user_vote == -1 %}active{% endif %}"
    hx-post="{{ vote_url }}"
    hx-vals='{"vote":"-1","csrf_token":"{{ csrf_token }}"}'
    hx-target="#vote-{{ target_id }}"
    hx-swap="outerHTML"
    aria-label="Downvote"
    title="Downvote"
    aria-pressed="{% if user_vote == -1 %}true{% else %}false{% endif %}">{% include "icons/arrow-down.html" %}</button>
</div>
