<div id="follow-button">
  {% if is_following %}
    <form method="POST" action="/u/{{ username }}/unfollow" class="inline-form" hx-post="/u/{{ username }}/unfollow" hx-target="#follow-button" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn">{% include "icons/check.html" %} Unfollow</button>
    </form>
  {% else %}
    <form method="POST" action="/u/{{ username }}/follow" class="inline-form" hx-post="/u/{{ username }}/follow" hx-target="#follow-button" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="btn btn-primary">{% include "icons/plus.html" %} Follow</button>
    </form>
  {% endif %}
</div>
