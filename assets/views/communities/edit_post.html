{% extends "layouts/base.html" %}
{% block title %}Edit Post - {{ community.name }} - Taverna{% endblock %}
{% block content %}
<h1>Edit Post in {{ community.name }}</h1>
<div class="card">
  <form method="POST" action="/c/{{ community.slug }}/posts/{{ post.id }}/edit">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-row">
      <label for="title">Title</label>
      <input type="text" name="title" id="title" required maxlength="300" class="form-input" value="{{ post.title }}">
    </div>
    <div class="form-row">
      <label for="body">Body (Markdown)</label>
      <textarea name="body" id="body" class="form-textarea">{{ post.body }}</textarea>
    </div>
    <div class="form-row">
      <label for="url">URL</label>
      <input type="url" name="url" id="url" class="form-input" value="{{ post.url }}">
    </div>
    <button type="submit" class="btn">Save</button>
  </form>
</div>
{% endblock %}
