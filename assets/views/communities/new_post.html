{% extends "layouts/base.html" %}
{% block title %}New Post - {{ community.name }} - Taverna{% endblock %}
{% block nav_communities %}is-active{% endblock %}
{% block content %}
<div class="main-narrow">
  <div class="page-head row" style="justify-content:flex-start;gap:1rem">
    <span class="group-icon">{{ community.name[:1] }}</span>
    <div>
      <h1>New post</h1>
      <p style="margin:0">in <a href="/c/{{ community.slug }}">{{ community.name }}</a></p>
    </div>
  </div>
  <form method="POST" action="/c/{{ community.slug }}/posts" class="card form post-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="segmented" role="radiogroup" aria-label="Post type" style="margin:0;background:var(--surface-container)">
      <label>
        <input type="radio" name="post_type" value="text" checked>
        {% include "icons/edit.html" %} Text
      </label>
      <label>
        <input type="radio" name="post_type" value="link">
        {% include "icons/link.html" %} Link
      </label>
    </div>

    <div class="field">
      <label for="title">Title</label>
      <input class="input" type="text" name="title" id="title" required maxlength="300">
    </div>

    <div class="field only-link">
      <label for="url">URL</label>
      <input class="input" type="url" name="url" id="url" placeholder="https://...">
    </div>

    <div class="field only-text">
      <label for="body">Text</label>
      <textarea class="textarea" name="body" id="body" rows="8" placeholder="Markdown supported"></textarea>
    </div>

    <div class="form-actions">
      <a class="btn btn-ghost" href="/c/{{ community.slug }}">Cancel</a>
      <button type="submit" class="btn btn-primary">Post</button>
    </div>
  </form>
</div>
{% endblock %}
