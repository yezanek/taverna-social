<!DOCTYPE html>
<html lang="en" data-theme="{{ theme | default(value='light') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Taverna{% endblock %}</title>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  <nav style="display:flex;align-items:center;gap:1rem;padding:0.5rem 1rem;background:var(--nav-bg);color:var(--nav-text)">
    <a href="/" style="color:var(--nav-text);text-decoration:none;font-weight:bold">Taverna</a>
    <a href="/c/" style="color:var(--nav-text);text-decoration:none">Communities</a>
    <span style="flex:1"></span>
    {% if user %}
      <a href="/u/{{ user.username }}" style="color:var(--nav-text);text-decoration:none">{{ user.username }}</a>
      <form method="POST" action="/logout" style="display:inline">
        <button type="submit" style="background:none;border:none;color:var(--nav-text);cursor:pointer">Logout</button>
      </form>
    {% else %}
      <a href="/login" style="color:var(--nav-text);text-decoration:none">Login</a>
      <a href="/register" style="color:var(--nav-text);text-decoration:none">Register</a>
    {% endif %}
    <form method="POST" action="/theme" style="display:inline">
      <button type="submit" name="theme" value="light" title="Light mode" style="background:none;border:none;color:var(--nav-text);cursor:pointer">☀</button>
      <button type="submit" name="theme" value="dark" title="Dark mode" style="background:none;border:none;color:var(--nav-text);cursor:pointer">●</button>
      <button type="submit" name="theme" value="sepia" title="Sepia mode" style="background:none;border:none;color:var(--nav-text);cursor:pointer">✦</button>
    </form>
  </nav>
  <main style="max-width:800px;margin:0 auto;padding:1rem">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
