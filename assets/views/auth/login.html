{% extends "layouts/base.html" %}
{% block title %}Log in - Taverna{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card" style="padding:2rem">
    <h1>Welcome back</h1>
    <p class="lede">Log in to post, comment and vote.</p>
    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}
    <form method="POST" action="/login" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token | default(value='') }}">
      <div class="field">
        <label for="identifier">Username or email</label>
        <input class="input" type="text" id="identifier" name="identifier" required autocomplete="username" placeholder="username or email@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Log in</button>
    </form>
  </div>
  <p class="auth-foot">Don't have an account? <a href="/register">Sign up</a></p>
</div>
{% endblock %}
