{% extends "layouts/base.html" %}
{% block title %}New Post - Taverna{% endblock %}
{% block nav_profile %}is-active{% endblock %}
{% block content %}
<div class="main-narrow">
  <div class="page-head">
    <h1>Write a post</h1>
    <p>Posts here go on your profile and out to your followers. To post in a community, open it and use <em>New post</em>.</p>
  </div>
  <form method="POST" action="/u/{{ username }}/posts" class="card form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="title">Title</label>
      <input class="input" type="text" name="title" id="title" required maxlength="300">
    </div>
    <div class="field">
      <label for="body">Body (Markdown)</label>
      <textarea class="textarea" name="body" id="body" rows="8"></textarea>
    </div>
    <div class="field">
      <label for="url">URL</label>
      <input class="input" type="url" name="url" id="url" placeholder="https://...">
    </div>
    <div class="form-actions">
      <a class="btn btn-ghost" href="/u/{{ username }}">Cancel</a>
      <button type="submit" class="btn btn-primary">Post</button>
    </div>
  </form>
</div>
{% endblock %}
