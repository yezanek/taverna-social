{% extends "layouts/base.html" %}
{% block title %}Taverna{% endblock %}
{% block content %}
<h1>Home Feed</h1>
{% if posts %}
  {% for post in posts %}
    {% include "partials/post_card.html" %}
  {% endfor %}
{% else %}
  <p>No posts yet.</p>
{% endif %}
{% if next_cursor %}<div class="load-more" style="text-align:center;margin:1rem 0"><a href="?cursor={{ next_cursor }}" class="btn">Load more</a></div>{% endif %}
{% endblock %}
