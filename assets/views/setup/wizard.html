{% extends "layouts/plain.html" %}
{% block title %}Set up your Taverna instance{% endblock %}
{% block content %}
<h1>Set up your Taverna instance</h1>

<form method="POST" action="/setup" style="max-width:500px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div style="margin-bottom:0.75rem">
    <label for="instance_name" style="display:block;margin-bottom:0.25rem;font-weight:bold">Instance Name</label>
    <input type="text" id="instance_name" name="instance_name" required style="width:100%;padding:0.5rem;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px">
  </div>

  <div style="margin-bottom:0.75rem">
    <label for="username" style="display:block;margin-bottom:0.25rem;font-weight:bold">Admin Username</label>
    <input type="text" id="username" name="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+" style="width:100%;padding:0.5rem;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px">
    <small style="color:var(--text-muted)">3–30 characters, letters, numbers, and underscores only</small>
  </div>

  <div style="margin-bottom:0.75rem">
    <label for="email" style="display:block;margin-bottom:0.25rem;font-weight:bold">Admin Email</label>
    <input type="email" id="email" name="email" required style="width:100%;padding:0.5rem;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px">
  </div>

  <div style="margin-bottom:0.75rem">
    <label for="password" style="display:block;margin-bottom:0.25rem;font-weight:bold">Admin Password</label>
    <input type="password" id="password" name="password" required minlength="8" style="width:100%;padding:0.5rem;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px">
  </div>

  <div style="margin-bottom:0.75rem">
    <label for="password_confirm" style="display:block;margin-bottom:0.25rem;font-weight:bold">Confirm Password</label>
    <input type="password" id="password_confirm" name="password_confirm" required minlength="8" style="width:100%;padding:0.5rem;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border);border-radius:4px">
  </div>

  <div style="margin-bottom:0.75rem">
    <label>
      <input type="checkbox" name="open_registrations" checked>
      Enable open registrations
    </label>
  </div>

  <button type="submit" style="padding:0.5rem 1rem;background:var(--accent);color:white;border:none;border-radius:4px;cursor:pointer">Set up Instance</button>
</form>
{% endblock %}
