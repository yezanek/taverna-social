{% extends "layouts/base.html" %}
{% block title %}Set up Taverna{% endblock %}
{% block content %}
<div class="auth-wrap" style="max-width:480px">
  <div class="card" style="padding:2rem">
    <h1>Set up your Taverna instance</h1>
    <p class="lede">Create the administrator account to get started.</p>
    <form method="POST" action="/setup" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="instance_name">Instance name</label>
        <input class="input" type="text" id="instance_name" name="instance_name" required>
      </div>
      <div class="field">
        <label for="username">Admin username</label>
        <input class="input" type="text" id="username" name="username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+">
        <span class="help">3–30 characters, letters, numbers, and underscores only</span>
      </div>
      <div class="field">
        <label for="email">Admin email</label>
        <input class="input" type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Admin password</label>
        <input class="input" type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="field">
        <label for="password_confirm">Confirm password</label>
        <input class="input" type="password" id="password_confirm" name="password_confirm" required minlength="8">
      </div>
      <label class="check">
        <input type="checkbox" name="open_registrations" checked>
        <div><strong>Enable open registrations</strong><span>Anyone can create an account. You can change this later.</span></div>
      </label>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Set up instance</button>
    </form>
  </div>
</div>
{% endblock %}
