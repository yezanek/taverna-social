logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 3000
  binding: localhost
  host: http://localhost
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: false
    host: localhost
    port: 1025
    secure: false

database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://localhost:5432/taverna_development") }}
  enable_logging: true
  connect_timeout: 5000
  idle_timeout: 600000
  min_connections: 2
  max_connections: 20
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: {{ get_env(name="JWT_SECRET", default="dev-secret-change-in-production") }}
    expiration: 3600
    location:
      from: Cookie
      name: access_token

taverna:
  base_url: "http://localhost:3000"
  domain: "localhost:3000"
  federation:
    enabled: false
    blocked_domains: []
    http_signature_expiry_seconds: 30
