logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 3000
  binding: localhost
  host: http://localhost
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: BackgroundAsync

mailer:
  smtp:
    enable: false
    host: localhost
    port: 1025
    secure: false

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://localhost:5432/taverna_development") %>
  enable_logging: true
  connect_timeout: 5000
  idle_timeout: 600000
  min_connections: 2
  max_connections: 20
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false

auth:
  jwt:
    secret: <%= get_env(name="JWT_SECRET", default="dev-secret-change-in-production") %>
    expiration: 3600
    location:
      from: Cookie
      name: access_token

# Taverna's own settings (src/common/config.rs). Deployment-specific values
# come from the environment; the defaults here are for local development.
settings:
  base_url: <%= get_env(name="BASE_URL", default="http://localhost:3000") %>
  domain: <%= get_env(name="TAVERNA_DOMAIN", default="localhost:3000") %>
  federation:
    enabled: <%= get_env(name="FEDERATION_ENABLED", default="false") %>
    # Comma-separated, e.g. BLOCKED_DOMAINS="spam.example,bad.example"
    blocked_domains: "<%= get_env(name="BLOCKED_DOMAINS", default="") %>"
    http_signature_expiry_seconds: <%= get_env(name="HTTP_SIGNATURE_EXPIRY_SECONDS", default="30") %>
  rate_limiting:
    enabled: <%= get_env(name="RATE_LIMITING_ENABLED", default="true") %>
    # Proxies whose X-Forwarded-For is trusted, as IPs or CIDRs,
    # comma-separated (e.g. TRUSTED_PROXIES="127.0.0.1,::1"). Leave empty
    # when the app is reached directly.
    trusted_proxies: "<%= get_env(name="TRUSTED_PROXIES", default="") %>"

# In-memory cache behind `ctx.cache` (NodeInfo counts). Loco's default is the
# null cache, which would turn caching off.
cache:
  kind: InMem
  max_capacity: 33554432
