logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  host: http://localhost
  middlewares:
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/static"
        path: "assets/static"
      fallback: "assets/static/404.html"

workers:
  mode: ForegroundBlocking

mailer:
  stub: true
  smtp:
    enable: false
    host: localhost
    port: 1025
    secure: false

database:
  uri: <%= get_env(name="TEST_DATABASE_URL", default="postgres://localhost:5432/taverna_test") %>
  enable_logging: false
  connect_timeout: 5000
  idle_timeout: 500
  min_connections: 0
  max_connections: 10
  auto_migrate: true
  dangerously_truncate: true
  dangerously_recreate: true

auth:
  jwt:
    secret: "test-secret-not-for-production"
    expiration: 3600
    location:
      from: Cookie
      name: access_token

taverna:
  base_url: "http://localhost:5150"
  domain: "localhost:5150"
  federation:
    enabled: false
    blocked_domains: []
    http_signature_expiry_seconds: 30
