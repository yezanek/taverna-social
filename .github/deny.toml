# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[licenses]
# Taverna is AGPL-3.0. All dependencies must be compatible.
# AGPL-3.0 is compatible with: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause,
# ISC, Unlicense, CC0-1.0, and other permissive licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",          # weak copyleft, compatible when used as a library
    "AGPL-3.0",         # our own license and activitypub_federation
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "OpenSSL",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-or-later", # Taverna itself
    "GPL-3.0",           # activitystreams-kinds; GPL-3.0 code may be combined with AGPL-3.0
]

# Any license not in the allow list is rejected (cargo-deny >= 0.14).
confidence-threshold = 0.8

exceptions = []

[bans]
# Deny duplicate versions of these critical crates
multiple-versions = "warn"
deny = [
    # Never allow these in any build
    { name = "openssl-sys", reason = "Use rustls instead — openssl-sys is a C dependency" },
]

# Crates we intentionally use and want to make explicit
allow = []

skip = []
skip-tree = []

[advisories]
# Fail on any known security vulnerability
version = 2
ignore = [
    # These mirror .cargo/audit.toml; see the reasons there.
    "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained (serde_yaml -> loco-rs)
    "RUSTSEC-2023-0071", # rsa Marvin, no fixed release (activitypub_federation)
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 (p256/p384 -> jsonwebtoken), HS256 only
]

[sources]
# Only allow crates.io as a source (no git deps in production)
unknown-registry = "deny"
unknown-git = "warn"   # warn rather than deny — some dev deps may use git
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
