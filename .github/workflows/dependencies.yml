name: Dependencies

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  # ── Check for outdated dependencies ──────────────────────────────────────
  outdated:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-outdated
        run: cargo install cargo-outdated --locked

      - name: Check for outdated deps
        # Exits 0 even if outdated — we report, not fail, for a weekly check
        run: |
          cargo outdated --root-deps-only --exit-code 0 | tee outdated.txt
          if grep -q "^[a-zA-Z]" outdated.txt; then
            echo "## Outdated dependencies found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat outdated.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Update with: \`cargo update\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "All dependencies are up to date." >> $GITHUB_STEP_SUMMARY
          fi

  # ── Security audit ────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── License compatibility check ───────────────────────────────────────────
  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses
        # Uses deny.toml — see .github/deny.toml
        run: cargo deny check licenses
