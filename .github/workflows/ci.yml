name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Cache key busted when rust-toolchain changes
  RUST_CACHE_KEY: v1

jobs:
  # ── Quick checks first (fail fast, cheap) ────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Tests (needs PostgreSQL) ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taverna
          POSTGRES_PASSWORD: taverna
          POSTGRES_DB: taverna_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://taverna:taverna@localhost:5432/taverna_test
      BASE_URL: http://localhost:3000
      TAVERNA_DOMAIN: localhost
      JWT_SECRET: test-secret-not-for-production

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}

      - name: Install pgmq
        run: |
          sudo apt-get install -y postgresql-server-dev-16 libclang-dev
          cargo install --locked cargo-pgrx --version 0.18.0
          cargo pgrx init --pg16 $(which pg_config) 2>/dev/null || true
          git clone --depth 1 https://github.com/tembo-io/pgmq.git /tmp/pgmq
          cd /tmp/pgmq && cargo pgrx install --pg-config $(which pg_config)
          PGPASSWORD=taverna psql -h localhost -U taverna -d taverna_test \
            -c "CREATE EXTENSION IF NOT EXISTS pgmq;"

      - name: Install sea-orm-cli
        run: cargo install sea-orm-cli --locked

      - name: Run migrations
        run: cargo loco db migrate

      - name: Run tests
        run: cargo test --all-features

  # ── Build (verify release compiles) ──────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}
      - run: cargo build --release --locked
