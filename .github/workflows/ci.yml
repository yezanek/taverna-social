name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

# Cancel in-progress runs on the same branch to save minutes
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Cache key busted when rust-toolchain changes
  RUST_CACHE_KEY: v2

jobs:
  # ── Quick checks first (fail fast, cheap) ────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Tests (needs PostgreSQL) ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [fmt, clippy]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taverna
          POSTGRES_PASSWORD: taverna
          POSTGRES_DB: taverna_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://taverna:taverna@localhost:5432/taverna_test
      TEST_DATABASE_URL: postgres://taverna:taverna@localhost:5432/taverna_test
      BASE_URL: http://localhost:3000
      TAVERNA_DOMAIN: localhost
      JWT_SECRET: test-secret-not-for-production
      # About 20 test binaries link against Loco 1.x; full debug info and
      # incremental artifacts filled the runner's disk (ld: Bus error).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}

      - name: Run migrations
        run: cargo loco db migrate

      - name: Run tests
        run: cargo test --all-features

  
